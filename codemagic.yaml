workflows:
  android-release-build:
    name: Instagram Offline-First Clone Production Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        ANDROID_NDK: "25.2.9519653"
      java: 17
      groups:
        - supabase_credentials
    triggering:
      events:
        - push
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      
      - name: Install and Setup FVM
        script: |
          dart pub global activate fvm
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          fvm install 3.35.7 --setup
          fvm use 3.35.7
          
      - name: Make Scripts Executable
        script: |
          chmod +x scripts/get_all.sh
          chmod +x scripts/build_runner.sh
          chmod +x scripts/setup_env.sh
          
      - name: Setup Environment Variables
        script: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          cd packages/env
          
          # Envied පැකේජයට අවශ්‍ය .env.dev ගොනුව සෑදීම
          cat <<EOF > .env.dev
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          POWERSYNC_URL=$POWERSYNC_URL
          GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
          FCM_SERVER_KEY=$FCM_SERVER_KEY
          IOS_CLIENT_ID=$IOS_CLIENT_ID
          WEB_CLIENT_ID=$WEB_CLIENT_ID
          EOF
          
          # Envied පැකේජයට අවශ්‍ය .env.prod ගොනුව සෑදීම
          cat <<EOF > .env.prod
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          POWERSYNC_URL=$POWERSYNC_URL
          GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
          FCM_SERVER_KEY=$FCM_SERVER_KEY
          IOS_CLIENT_ID=$IOS_CLIENT_ID
          WEB_CLIENT_ID=$WEB_CLIENT_ID
          EOF
          
          cd ../..
          
      - name: Install All Multi-Package Dependencies
        script: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          ./scripts/get_all.sh
          
      - name: Run Build Runner for Packages & Root
        script: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          ./scripts/build_runner.sh shared clean
          ./scripts/build_runner.sh shared
          
          ./scripts/build_runner.sh insta_blocks clean
          ./scripts/build_runner.sh insta_blocks
          
          # Env package එක සඳහා සැබෑ .env.dev සහ .env.prod ගොනු උපයෝගී කරගෙන කේත ජනනය කිරීම
          cd packages/env
          fvm dart run build_runner clean
          fvm dart run build_runner build --delete-conflicting-outputs
          cd ../..
          
          fvm dart run build_runner clean
          fvm dart run build_runner build --delete-conflicting-outputs
          
      - name: Generate Localizations
        script: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          fvm flutter gen-l10n
          
      - name: Build Android APK (Release Mode)
        script: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          fvm flutter build apk --release --flavor production -t lib/main_production.dart
          
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
